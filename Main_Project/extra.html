<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <link rel="stylesheet" href="extra.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Kanban</div>
        <div class="right">
          <button class="modal-activate">Add new task</button>
        </div>
      </nav>

      <section class="board">
        <div id="todo" class="task-column">
          <div class="heading">
            <div class="left">To Do</div>
            <div class="right">Count</div>
          </div>
          <div class="tasks"></div>
        </div>
        <div id="progress" class="task-column">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </div>
          <div class="tasks"></div>
        </div>
        <div id="done" class="task-column">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">Count</div>
          </div>
          <div class="tasks"></div>
        </div>
      </section>
    </main>
    <div class="modal">
      <div class="bg"></div>
      <div class="center">
        <input type="text" id="title" placeholder="Task Title" />
        <textarea
          name="desc"
          id="desc"
          placeholder="Task Description"
        ></textarea>
        <button id="addTaskBtn">Add Task</button>
      </div>
    </div>

    <script src="extra.js"></script>
  </body>
</html>
